# لأوامر migrations والتطوير المحلي فقط. عمدًا بلا pages_build_output_dir حتى تبقى إعدادات النشر
# (الأسرار وBinding قاعدة D1) تُدار من لوحة Cloudflare Pages ولا يتجاهلها Cloudflare.
name = "schbns"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "school_platform_db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
